name: CI

on:
  push:
    paths-ignore:
      - 'desktop/**'
      - 'tests/test_desktop*'
      - 'scripts/**'
  pull_request:
    paths-ignore:
      - 'desktop/**'
      - 'tests/test_desktop*'
      - 'scripts/**'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -U pip && pip install -e ".[dev]"
      - name: Version
        run: rad version
      - name: Doctor (offline, no keys required)
        env:
          RAD_HOME: ${{ runner.temp }}/rad-ci-home
        run: rad doctor --offline
      - name: Unit / integration tests
        run: python -m pytest -q
      - name: Acceptance gate
        env:
          RAD_HOME: ${{ runner.temp }}/rad-ci-home
        run: rad acceptance
