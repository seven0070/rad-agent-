# Release Desktop — triggered by `rad-desktop-*` tags.
# Windows-first: builds the `rad` PyInstaller sidecar, then `tauri build`
# (which bundles the sidecar via externalBin), then uploads installer bundles
# + the sidecar to the GitHub release.
#
# NOTE: desktop releases use the independent `rad-desktop-*` tag scheme and are
# decoupled from control-plane (Python package) tags.
# No secrets required (default GITHUB_TOKEN is used by softprops/action-gh-release).

name: Release Desktop

on:
  push:
    tags:
      - 'rad-desktop-*'

jobs:
  build-windows:
    name: Build + release Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build rad sidecar (PyInstaller onefile)
        run: powershell -File scripts/build-sidecar.ps1
      - name: Verify sidecar artifact
        shell: pwsh
        run: |
          $sidecar = 'desktop/src-tauri/binaries/rad-x86_64-pc-windows-msvc.exe'
          if (-not (Test-Path -LiteralPath $sidecar)) { throw "Sidecar missing: $sidecar" }
          $size = (Get-Item -LiteralPath $sidecar).Length
          if ($size -lt 1MB) { throw "Sidecar too small: $size bytes (expected > 1MB)" }
          Write-Output "Sidecar OK: $sidecar ($([math]::Round($size / 1MB, 2)) MB)"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Build Tauri app (bundles sidecar via externalBin)
        working-directory: desktop
        run: npm run tauri build
      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            RAD Desktop release.

            > Desktop releases use the independent `rad-desktop-*` tag scheme and
            > are decoupled from control-plane (Python package) tags.
          files: |
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/binaries/rad-x86_64-pc-windows-msvc.exe

