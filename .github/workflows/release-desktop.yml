# Release Desktop — triggered by `rad-desktop-*` tags.
# Windows-first: scripts/build-desktop-release.ps1 freezes BOTH sidecars
# (rad + rad-backend) in isolated venvs, asserts sizes/freshness, runs
# `tauri build` (bundles externalBin sidecars into MSI + NSIS), then uploads
# the installers + sidecars to the GitHub release.
#
# NOTE: desktop releases use the independent `rad-desktop-*` tag scheme and are
# decoupled from control-plane (Python package) tags.
# No secrets required (default GITHUB_TOKEN is used by softprops/action-gh-release).

name: Release Desktop

on:
  push:
    tags:
      - 'rad-desktop-*'

jobs:
  build-windows:
    name: Build + release Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Install sidecar extra (PyInstaller)
        shell: pwsh
        run: python -m pip install -U pip; pip install -e ".[sidecar]"
      - name: Desktop release (sidecar freeze + assert + tauri build + bundle check)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/build-desktop-release.ps1
        env:
          # Deterministic MSVC sidecar name (Windows runners); override already set by script for src-tauri
          CARGO_BUILD_JOBS: '2'
      - name: Upload release artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            RAD Desktop release.

            > Desktop releases use the independent `rad-desktop-*` tag scheme and
            > are decoupled from control-plane (Python package) tags.
          files: |
            desktop/src-tauri/target/release/bundle/**/*.msi
            desktop/src-tauri/target/release/bundle/**/*.exe
            desktop/src-tauri/binaries/rad-x86_64-pc-windows-msvc.exe
            desktop/src-tauri/binaries/rad-backend-x86_64-pc-windows-msvc.exe

