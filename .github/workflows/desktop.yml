# Desktop CI — runs only when desktop-relevant files change.
# Frontend gate (node 20), Rust/Tauri gate (cargo check/clippy/build on Linux
# with webkit system deps), and desktop surface tests (python 3.12).
# No secrets required; matrix kept minimal.

name: Desktop CI

on:
  push:
    paths:
      - 'desktop/**'
      - 'tests/test_desktop*'
      - 'scripts/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - 'tests/test_desktop*'
      - 'scripts/**'
      - '.github/workflows/desktop.yml'

jobs:
  frontend:
    name: Frontend (node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install dependencies
        working-directory: desktop
        run: npm ci
      - name: Build frontend
        working-directory: desktop
        run: npm run build
      - name: Type-check (no emit)
        working-directory: desktop
        run: npx tsc --noEmit

  rust:
    name: Rust / Tauri (cargo check, clippy, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install frontend dependencies
        working-directory: desktop
        run: npm ci
      - name: Build frontend (tauri-build validates frontendDist)
        working-directory: desktop
        run: npm run build
      - name: Install Linux webkit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf
          if apt-cache show libappindicator3-dev >/dev/null 2>&1; then
            sudo apt-get install -y libappindicator3-dev
          else
            sudo apt-get install -y libayatana-appindicator3-dev
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Create sidecar placeholder for host triple (compile-time externalBin check)
        run: |
          mkdir -p desktop/src-tauri/binaries
          touch desktop/src-tauri/binaries/rad-x86_64-unknown-linux-gnu
      - name: Cargo check (retry 3× on flake)
        working-directory: desktop/src-tauri
        # v3.2 reliability: cargo check flakes on webkit sys-deps; retry 3× with 5s backoff
        run: |
          for i in 1 2 3; do
            echo "cargo check attempt $i/3"
            cargo check && break || {
              ec=$?
              if [ $i -eq 3 ]; then echo "cargo check failed after 3 attempts"; exit $ec; fi
              echo "cargo check flake — retrying in 5s..."
              sleep 5
            }
          done
      - name: Cargo clippy (deny warnings)
        working-directory: desktop/src-tauri
        run: cargo clippy -- -D warnings
      - name: Cargo build
        working-directory: desktop/src-tauri
        run: cargo build

  surface-tests:
    name: Desktop surface tests (python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -U pip && pip install -e ".[dev]"
      - name: Desktop surface / API / security tests
        run: python -m pytest -q tests/test_desktop_surface.py tests/test_desktop_api.py tests/test_desktop_security_surface.py
      - name: Full test suite (919+ stays green, -n auto not OOM)
        # v3.2: -n auto stays 919+; loadscope + worksteal avoids OOM on 2-core CI; single test per worker
        run: python -m pytest -q -n auto --dist worksteal --tb=line