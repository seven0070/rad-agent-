[package]
name = "rad-desktop"
version = "1.0.1"
description = "RAD Desktop 1.0.1 — operator surface"
authors = ["Rad"]
edition = "2021"

[lib]
name = "rad_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
